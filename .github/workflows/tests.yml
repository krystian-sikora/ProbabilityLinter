name: Tests
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out MarkdownLinter
        uses: actions/checkout@v4
      - name: Check out ProbabilityIter
        uses: actions/checkout@v4
        with:
          repository: kacpertopolnicki/ProbabilityIter
          path: ProbabilityIter
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ProbabilityIter
          pip install attrs cattrs pygls lsprotocol sympy numpy torch
      - name: Run tests
        run: python -m unittest test.tests test.test_piter_interface